<body class="bg-white">

    <header class="hero-clear pb-24 bg-slate-950 text-white relative overflow-hidden">

        <div class="container mx-auto px-6 relative z-10 text-center">
            <span class="font-oswald text-blue-400 uppercase tracking-[.35em] text-xs font-bold">Visual Archive</span>
            <h1 class="text-4xl md:text-7xl font-black mt-5 mb-6">Moments in <span class="italic font-light text-blue-300">Focus</span></h1>
            <p class="max-w-2xl mx-auto text-slate-300 leading-relaxed">A curated collection of NSSR events, workshops, outreach programs, and community moments captured across Nepal.</p>
        </div>
    </header>

    <section class="creative-photo-wall py-20 md:py-28">
        <div class="wall-header text-center max-w-3xl mx-auto mb-16 px-6">
            <h2 class="wall-title font-serif font-black text-3xl md:text-5xl text-slate-900 mb-4">Visual Archive</h2>
            <p class="wall-subtitle text-slate-600 text-lg leading-relaxed">Exploring NSSR's impact through the lens — workshops, talks, outreach, and community.</p>
        </div>

        <div class="masonry-grid" id="masonry-grid">
            <!-- Images will be injected by JavaScript -->
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- Lightbox -->
    <div id="gallery-lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Gallery Preview">
    </div>

            { src: "assets/images/profdr.jpeg", alt: "Prof. Raju Tyata" },
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('masonry-grid');
            if (grid) {
                grid.innerHTML = galleryImages.map(img => `
                    <div class="masonry-item">
                        <img src="${img.src}" alt="${img.alt}" loading="lazy" onload="this.classList.add('loaded')">
                    </div>
                `).join('');
            }

            // Lightbox logic - Bulletproof event delegation
            const lightbox = document.getElementById('gallery-lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const closeBtn = document.querySelector('.lightbox-close');

            if (!lightbox || !lightboxImg) return;

            // Listen to all clicks on the page
            document.addEventListener('click', (e) => {
                // Check if the click happened inside a gallery item
                const galleryContainer = e.target.closest('.masonry-item, .gallery-item, .portfolio-wrap, .portfolio-item');
                
                if (galleryContainer) {
                    e.preventDefault();
                    
                    // Find the actual image tag inside this specific container
                    const img = galleryContainer.querySelector('img');
                    
                    if (img && img.src) {
                        lightboxImg.src = img.src; 
                        lightbox.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    }
                }
            });

            // Close Lightbox Logic
            const closeLightbox = () => {
                lightbox.classList.remove('active');
                setTimeout(() => { lightboxImg.src = ''; }, 300);
                document.body.style.overflow = 'auto';
            };

            if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target !== lightboxImg) closeLightbox(); 
            });
        });
    </script>
</body>
</html>
