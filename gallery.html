<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | NSSR</title>
    <link rel="icon" type="image/png" href="assets/images/bluelogonobg.png">
    <link rel="stylesheet" href="assets/css/tailwind.css">    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/vendor/fonts/fonts.css"></head>
<body class="bg-white">
    <div id="nav-placeholder"></div>

    <header class="hero-clear pb-24 bg-slate-950 text-white relative overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(37,99,235,.35),_transparent_48%),linear-gradient(135deg,#0f172a,#172554)]"></div>
        <div class="container mx-auto px-6 relative z-10 text-center">
            <span class="font-oswald text-blue-400 uppercase tracking-[.35em] text-xs font-bold">Visual Archive</span>
            <h1 class="text-4xl md:text-7xl font-black mt-5 mb-6">Moments in <span class="italic font-light text-blue-300">Focus</span></h1>
            <p class="max-w-2xl mx-auto text-slate-300 leading-relaxed">A curated collection of NSSR events, workshops, outreach programs, and community moments captured across Nepal.</p>
        </div>
    </header>

    <section class="creative-photo-wall py-20 md:py-28">
        <div class="wall-header text-center max-w-3xl mx-auto mb-16 px-6">
            <h2 class="wall-title font-serif font-black text-3xl md:text-5xl text-slate-900 mb-4">Visual Archive</h2>
            <p class="wall-subtitle text-slate-600 text-lg leading-relaxed">Exploring NSSR's impact through the lens — workshops, talks, outreach, and community.</p>
        </div>

        <div class="masonry-grid" id="masonry-grid">
            <!-- Images will be injected by JavaScript -->
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- Lightbox -->
    <div id="gallery-lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" alt="Gallery Preview">
    </div>

    <script src="assets/js/main.js" defer></script>
    <script>
        // Gallery images data - using original Photos/ folder images
                const galleryImages = [
            { src: "Photos/IMG_20260902_144525.jpg", alt: "NSSR workshop session" },
            { src: "Photos/IMG_20260902_144529.jpg", alt: "Students at NSSR event" },
            { src: "Photos/IMG_20260902_144533.jpg", alt: "Workshop in progress" },
            { src: "Photos/Photooooo/IMG_1884.jpeg", alt: "Science workshop activity" },
            { src: "Photos/Photos by Khwopa/IMG_0889.JPG", alt: "Khwopa College event" },
            { src: "assets/images/latexfolder/latex-main.jpg", alt: "Scientific Writing & LaTeX workshop session" },
            { src: "Photos/IMG_20260902_144747.jpg", alt: "NSSR team photo" },
            { src: "Photos/Photooooo/IMG_1855.jpeg", alt: "Educational program" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('masonry-grid');
            if (grid) {
                grid.innerHTML = galleryImages.map(img => `
                    <div class="masonry-item">
                        <img src="${img.src}" alt="${img.alt}" loading="lazy" onload="this.classList.add('loaded')">
                    </div>
                `).join('');
            }

            // Lightbox logic - Bulletproof event delegation
            const lightbox = document.getElementById('gallery-lightbox');
            const lightboxImg = document.getElementById('lightbox-img');

            if (!lightbox || !lightboxImg) return;

            // Listen to all clicks on the page
            document.addEventListener('click', (e) => {
                // Look for any gallery container clicked
                const galleryItem = e.target.closest('.masonry-item, .gallery-item, .portfolio-wrap, .portfolio-item');

                if (galleryItem) {
                    e.preventDefault();
                    let imageSource = '';

                    // Check 1: Does the container have an href pointing to the image? (Best quality)
                    if (galleryItem.tagName.toLowerCase() === 'a' && galleryItem.href) {
                        imageSource = galleryItem.href;
                    }
                    // Check 2: Look for an <img> tag inside the container
                    else {
                        const img = galleryItem.querySelector('img');
                        if (img && img.src) {
                            imageSource = img.src;
                        }
                    }

                    // If we found a source, show the clear image
                    if (imageSource && !imageSource.endsWith('#')) {
                        lightboxImg.src = imageSource;
                        lightbox.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    }
                }
            });

            // Close when clicking the dark background or close button
            const closeLightbox = () => {
                lightbox.classList.remove('active');
                setTimeout(() => { lightboxImg.src = ''; }, 300);
                document.body.style.overflow = '';
            };

            lightbox.addEventListener('click', (e) => {
                if (e.target !== lightboxImg) {
                    closeLightbox();
                }
            });
        });
    </script>
</body>
</html>
