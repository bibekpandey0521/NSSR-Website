        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('masonry-grid');
            if (grid) {
                grid.innerHTML = galleryImages.map(img => `
                    <div class="masonry-item">
                        <img src="${img.src}" alt="${img.alt}" loading="lazy" onload="this.classList.add('loaded')" onerror="this.src='https://via.placeholder.com/400x300/0f172a/ffffff?text=Image+Not+Found'; this.classList.add('loaded'); console.error('Failed to load:', '${img.src}');">
                    </div>
                `).join('');
            }

            // Lightbox logic - Bulletproof event delegation
            const lightbox = document.getElementById('gallery-lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const closeBtn = document.querySelector('.lightbox-close');

            if (!lightbox || !lightboxImg) return;

            // Listen to all clicks on the page
            document.addEventListener('click', (e) => {
                // Check if the click happened inside a gallery item
                const galleryContainer = e.target.closest('.masonry-item, .gallery-item, .portfolio-wrap, .portfolio-item');
                
                if (galleryContainer) {
                    e.preventDefault();
                    
                    // Find the actual image tag inside this specific container
                    const img = galleryContainer.querySelector('img');
                    
                    if (img && img.src) {
                        console.log('Opening lightbox with:', img.src);
                        lightboxImg.src = img.src; 
                        lightbox.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    } else {
                        console.error('Lightbox Error: Could not find an <img> tag inside the clicked gallery item.');
                    }
                }
            });

            // Handle image load error in lightbox
            lightboxImg.addEventListener('error', () => {
                console.error('Failed to load image:', lightboxImg.src);
                lightboxImg.alt = 'Image not found';
            });

            // Close Lightbox Logic
            const closeLightbox = () => {
                lightbox.classList.remove('active');
                setTimeout(() => { lightboxImg.src = ''; }, 300);
                document.body.style.overflow = 'auto';
            };

            if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target !== lightboxImg) closeLightbox(); 
            });
        });
