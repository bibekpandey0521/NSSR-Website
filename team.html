<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team | NSSR</title>
	<!-- Favicon / Logo in Tab -->
    <link rel="icon" type="image/png" href="photos/bluelogonobg.png">
    <!-- Optional: For Apple Devices -->
    <link rel="apple-touch-icon" href="bluelogonobg.png">
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Merriweather:ital,wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --nssr-blue: #004AAD; --nssr-dark: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: #fff; color: #1e293b; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Merriweather', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }

        /* Unified Navigation Placeholder */
        #nav-placeholder {
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000;
            transition: transform 0.4s ease-in-out;
            background: white;
            min-height: 80px;
        }

        /* Responsive Card Hover Effects */
        .team-card { transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1); }
        
        /* Grayscale to Color */
        .grayscale-img {
            filter: grayscale(0%);
            transition: filter 0.5s ease;
        }
        .group:hover .grayscale-img { filter: grayscale(0%); }

        /* Social Link Transitions */
        .social-link { transition: all 0.3s ease; }
        .social-link:hover { color: var(--nssr-blue); transform: scale(1.1); }

        @media (max-width: 768px) {
            /* Make social links visible on mobile since there is no hover */
            .mobile-social-visible { transform: translateY(0) !important; opacity: 1 !important; }
            .grayscale-img { filter: grayscale(0%); } /* Optional: show color on mobile */
        }
    </style>
</head>

<body class="bg-white">

    <!-- LIGHTBOX MODAL -->
    <div id="lightbox" onclick="closeLightbox()" class="fixed inset-0 z-[2000] hidden bg-black/95 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer">
        <button class="absolute top-6 right-6 text-white text-3xl hover:text-blue-400 transition z-50">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="lightbox-img" onclick="event.stopPropagation()" src="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl transform scale-95 transition-transform duration-300">
    </div>

    <div id="nav-placeholder"></div>

    <!-- 1. HERO SECTION -->
    <header class="pt-32 pb-16 md:pt-48 md:pb-24 bg-slate-900 text-white relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
        <div class="container mx-auto px-6 relative z-10 text-center">
            <span class="font-oswald text-blue-400 uppercase tracking-widest text-[10px] md:text-xs font-bold mb-4 block">The Faces Behind NSSR</span>
            <h1 class="text-3xl md:text-7xl font-bold mb-6">Our <span class="text-blue-400 italic font-light">Visionary Team</span></h1>
            <p class="max-w-2xl mx-auto text-gray-400 text-sm md:text-base font-light leading-relaxed">Meet the dedicated researchers working to bridge the gap between academic curiosity and scientific excellence in Nepal.</p>
        </div>
    </header>

    <!-- 2. EXECUTIVE BOARD GRID -->
    <section class="py-16 md:py-24 bg-white">
        <div class="container mx-auto px-6">
            <div class="text-center mb-12 md:mb-16">
                <h3 class="font-oswald uppercase tracking-widest text-xs font-bold text-blue-600">Leadership</h3>
                <h2 class="text-3xl md:text-4xl font-bold mt-2 text-slate-900">Executive Board</h2>
                <div class="w-16 h-1 bg-blue-600 mx-auto mt-4"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-10" id="exec-board-grid">
                <!-- JS Injected Cards -->
            </div>
        </div>
    </section>

    <!-- 3. ADVISORS SECTION -->
    <section class="py-16 md:py-20 bg-slate-50 border-y border-slate-200 overflow-hidden">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-10 gap-4">
                <div>
                    <h3 class="font-oswald uppercase tracking-widest text-xs font-bold text-blue-600">Guidance</h3>
                    <h2 class="text-2xl md:text-3xl font-bold mt-2">Board of Advisors</h2>
                </div>
                <div class="flex gap-2">
                    <button class="adv-prev-btn p-3 md:p-4 border rounded-full hover:bg-white transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <button class="adv-next-btn p-3 md:p-4 border rounded-full hover:bg-white transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>
            </div>

            <div class="swiper advisorSwiper">
                <div class="swiper-wrapper" id="advisor-wrapper">
                    <!-- JS Injected Advisors -->
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="nav.js"></script>

        // 2. RENDERER
        function renderTeam() {
            const execGrid = document.getElementById('exec-board-grid');
            const advWrapper = document.getElementById('advisor-wrapper');

            if (execGrid) {
                execGrid.innerHTML = executiveBoard.map(member => `
                    <div class="team-card group">
                        <div class="relative overflow-hidden bg-slate-100 aspect-square rounded-lg shadow-sm">
                            <img src="${member.image}" class="grayscale-img w-full h-full object-cover">
                            <!-- Mobile-Social-Visible class ensures icons show on touch screens -->
                            <div class="absolute bottom-4 left-4 right-4 flex justify-center gap-4 translate-y-20 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 md:translate-y-20 md:opacity-0 transition-all duration-500 mobile-social-visible">
                                <a href="${member.linkedin}" target="_blank" class="social-link bg-white w-10 h-10 flex items-center justify-center rounded-full shadow-lg text-slate-900"><i class="fa-brands fa-linkedin-in"></i></a>
                                <a href="mailto:${member.email}" class="social-link bg-white w-10 h-10 flex items-center justify-center rounded-full shadow-lg text-slate-900"><i class="fa-solid fa-envelope"></i></a>
                            </div>
                        </div>
                        <div class="mt-6 text-center">
                            <h4 class="font-bold text-lg md:text-xl text-slate-900 leading-tight">${member.name}</h4>
                            <p class="text-blue-600 font-oswald uppercase text-[10px] md:text-xs tracking-widest mt-1">${member.role}</p>
                            <p class="text-gray-500 text-[11px] mt-2 italic px-2">${member.dept}</p>
                        </div>
                    </div>`).join('');
            }

            if (advWrapper) {
                advWrapper.innerHTML = advisors.map(adv => `
                    <div class="swiper-slide h-auto">
                        <div class="team-card group bg-white border border-slate-200 rounded-xl p-6 md:p-10 flex flex-col items-center h-full text-center">
                            <div class="w-24 h-24 md:w-32 md:h-32 overflow-hidden bg-slate-100 rounded-full mb-6 border-4 border-white shadow-md">
                                <img src="${adv.image}" class="grayscale-img w-full h-full object-cover">
                            </div>
                            <h4 class="font-bold text-lg text-slate-900">${adv.name}</h4>
                            <p class="text-blue-600 font-oswald uppercase text-[10px] tracking-widest mt-1">${adv.role}</p>
                            <div class="w-8 h-px bg-slate-200 my-4"></div>
                            <p class="text-slate-500 text-xs italic leading-relaxed">${adv.inst}</p>
                        </div>
                    </div>`).join('');

                new Swiper(".advisorSwiper", {
                    slidesPerView: 1, spaceBetween: 24, loop: true,
                    navigation: { nextEl: ".adv-next-btn", prevEl: ".adv-prev-btn" },
                    breakpoints: { 640: { slidesPerView: 2 }, 1024: { slidesPerView: 3 } }
                });
            }
        }

        // 3. LIGHTBOX & ROUTING
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // 4. INITIAL LOAD
        window.addEventListener('load', renderTeam);
    </script>
</body>
</html>
