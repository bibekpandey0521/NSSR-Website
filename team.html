<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team | NSSR</title>
	<!-- Favicon / Logo in Tab -->
    <link rel="icon" type="image/png" href="assets/images/bluelogonobg.png">
    <!-- Optional: For Apple Devices -->
    <link rel="apple-touch-icon" href="bluelogonobg.png">
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Unified NSSR design system -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- End design system -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Merriweather:ital,wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
</head>

<body class="bg-[#fcfcfc]">

    <div id="nav-placeholder"></div>

    <!-- 1. HERO SECTION -->
    <header class="hero-clear pb-12 md:pb-16 bg-slate-900 text-white relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
        <div class="container mx-auto px-6 relative z-10 text-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-4">Our <span class="text-blue-400 italic font-light">Team</span></h1>
            <p class="max-w-2xl mx-auto text-gray-400 text-sm md:text-base font-light leading-relaxed">Meet the dedicated researchers working to bridge the gap between academic curiosity and scientific excellence in Nepal.</p>
        </div>
    </header>

    <!-- 2. SPLIT VIEW LAYOUT -->
    <div class="container mx-auto px-6 py-12 md:py-20 flex flex-col md:flex-row gap-10">
        
        <!-- Left Sidebar Navigation -->
        <aside class="w-full md:w-1/4 shrink-0">
            <h2 class="text-4xl font-bold text-slate-900 mb-8 font-merriweather">Team</h2>
            <nav class="flex flex-col gap-2 border-l border-slate-200" id="team-nav">
                <button onclick="showSection('leadership')" id="btn-leadership" class="text-left px-6 py-3 -ml-[1px] border-l-4 border-blue-900 bg-blue-50/50 text-blue-900 font-bold rounded-r-lg transition-all">
                    Leadership
                </button>
                <button onclick="showSection('advisory')" id="btn-advisory" class="text-left px-6 py-3 -ml-[1px] border-l-4 border-transparent text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-r-lg transition-all">
                    Advisory Board
                </button>
                <button onclick="showSection('representatives')" id="btn-representatives" class="text-left px-6 py-3 -ml-[1px] border-l-4 border-transparent text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-r-lg transition-all">
                    College Representatives
                </button>
            </nav>
        </aside>

        <!-- Right Content Area -->
        <main class="w-full md:w-3/4">
            <!-- Leadership Grid -->
            <div id="content-leadership" class="team-section grid grid-cols-1 xl:grid-cols-2 gap-6">
                <!-- JS Injected Cards -->
            </div>

            <!-- Advisory Grid -->
            <div id="content-advisory" class="team-section hidden grid grid-cols-1 xl:grid-cols-2 gap-6">
                <!-- JS Injected Cards -->
            </div>

            <!-- College Representatives Section -->
            <div id="content-representatives" class="team-section hidden">
                <div id="reps-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <!-- JS Injected Cards -->
                </div>
                
                <!-- Join Community Link (Below College Reps) -->
                <div class="mt-8 flex justify-start">
                    <a href="https://forms.gle/csSUtYrEL4mw6QnJ8" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 bg-slate-900 px-6 py-3.5 text-center font-oswald text-xs uppercase tracking-widest text-white hover:bg-blue-700 transition rounded shadow-md">
                        Be a College Representative
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/pages/team.js" defer></script>
</body>
</html>
