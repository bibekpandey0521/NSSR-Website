<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team | NSSR</title>
	<!-- Favicon / Logo in Tab -->
    <link rel="icon" type="image/png" href="assets/images/bluelogonobg.png">
    <!-- Optional: For Apple Devices -->
    <link rel="apple-touch-icon" href="assets/images/bluelogonobg.png">
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Unified NSSR design system -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- End design system -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@300;400;600;700&family=Source+Serif+4:ital,wght@300;400;600;700&display=swap" rel="stylesheet">
    
</head>

<body class="bg-white">

    <div id="nav-placeholder"></div>

    <!-- 1. HERO SECTION -->
    <header class="team-hero bg-slate-950 text-white relative overflow-hidden">
        <div class="container mx-auto px-6 relative z-10 text-center py-20 md:py-28">
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-serif font-black mb-6 text-white leading-tight" style="font-family: 'Source Serif 4', serif;">Our <span class="italic font-light text-blue-300">Team</span></h1>
            <p class="max-w-2xl mx-auto text-slate-300 text-base md:text-lg font-light leading-relaxed">Meet the dedicated researchers working to bridge the gap between academic curiosity and scientific excellence in Nepal.</p>
        </div>
    </header>

    <!-- 2. SPLIT VIEW LAYOUT -->
    <div class="container mx-auto px-6 py-12 md:py-20 flex flex-col md:flex-row gap-10">
        
        <!-- Left Sidebar Navigation -->
        <aside class="w-full md:w-1/4 shrink-0">
            <h2 class="text-3xl md:text-4xl font-black text-slate-900 mb-8 font-serif" style="font-family: 'Source Serif 4', serif;">Team</h2>
            <nav class="team-sidebar" id="team-nav">
                <button onclick="showSection('leadership')" id="btn-leadership" class="team-nav-btn active">
                    Leadership
                </button>
                <button onclick="showSection('advisory')" id="btn-advisory" class="team-nav-btn">
                    Advisory Board
                </button>
                <button onclick="showSection('representatives')" id="btn-representatives" class="team-nav-btn">
                    College Representatives
                </button>
            </nav>
        </aside>

        <!-- Right Content Area -->
        <main class="w-full md:w-3/4">
            <!-- Leadership Grid -->
            <div id="content-leadership" class="team-section editorial-grid">
                <!-- JS Injected Cards -->
            </div>

            <!-- Advisory Grid -->
            <div id="content-advisory" class="team-section hidden editorial-grid">
                <!-- JS Injected Cards -->
            </div>

            <!-- College Representatives Section -->
            <div id="content-representatives" class="team-section hidden">
                <div id="reps-grid" class="editorial-grid">
                    <!-- JS Injected Cards -->
                </div>
                
                <!-- Join Community Link (Below College Reps) -->
                <div class="mt-12 pt-8 border-t border-slate-200">
                    <a href="https://forms.gle/csSUtYrEL4mw6QnJ8" target="_blank" rel="noopener noreferrer" class="btn-primary btn-sharp inline-flex">
                        Be a College Representative
                        <i class="fa-solid fa-arrow-up-right-from-square ml-2"></i>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/pages/team.js" defer></script>
</body>
</html>
