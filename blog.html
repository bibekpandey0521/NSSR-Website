<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dispatch | NSSR Blog</title>
	<!-- Favicon / Logo in Tab -->
    <link rel="icon" type="image/png" href="assets/images/bluelogonobg.png">
    <!-- Optional: For Apple Devices -->
    <link rel="apple-touch-icon" href="assets/images/bluelogonobg.png">
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Unified NSSR design system -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- End design system -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Merriweather:ital,wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
</head>
<body class="bg-white">

    <!-- Progress Bar -->
    <div id="progress-container"><div id="progress-bar"></div></div>
    
    <!-- Navigation (Injected by nav.js) -->
    <div id="nav-placeholder"></div>

    <!-- 1. EDITORIAL HERO -->
    <header id="blog-hero" class="hero-clear pb-16 border-b">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
                <div class="max-w-3xl">
                    <span class="font-oswald text-blue-600 uppercase tracking-[0.4em] text-[10px] md:text-xs font-bold mb-4 block">NSSR Thought Leadership</span>
                    <h1 class="text-4xl md:text-8xl font-bold text-slate-900 leading-tight">The <span class="italic font-light">Dispatch.</span></h1>
                </div>
                <div class="text-left md:text-right border-l md:border-l-0 pl-4 md:pl-0">
                    <p class="font-oswald text-[10px] uppercase tracking-widest text-slate-400">Scientific Journal</p>
                    <p class="text-xs text-gray-500 italic">Insights from Student Researchers</p>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. BLOG CONTENT AREA -->
    <main class="py-12 md:py-20">
        <div class="container mx-auto px-6">
            
            <!-- LIST VIEW -->
            <div id="blog-list-view" class="grid grid-cols-1 lg:grid-cols-12 gap-16">
                <!-- Main Feed -->
                <div class="lg:col-span-8 space-y-2" id="blog-feed">
                    <!-- JS Injected Articles -->
                </div>

                <!-- Sidebar (Hidden on Mobile) -->
                <aside class="lg:col-span-4 hidden lg:block border-l pl-10">
                    <div class="sticky top-32">
                        <h4 class="font-oswald text-[10px] font-bold uppercase tracking-widest mb-8 border-b pb-4 text-slate-500">Editor's Choice</h4>
                        <div id="featured-sidebar" class="space-y-10">
                            <!-- JS Injected Featured -->
                        </div>
                    </div>
                </aside>
            </div>

            <!-- DETAIL VIEW (Reading Mode) -->
            <div id="blog-detail-view" class="fade-in hidden">
                <div class="reading-container">
                    <button onclick="window.location.hash = ''" class="mb-10 flex items-center text-[10px] font-oswald font-bold uppercase tracking-widest text-blue-600 transition-all hover:gap-2">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Back to Dispatch
                    </button>
                    
                    <header class="mb-12">
                        <div id="detail-header"></div>
                    </header>

                    <div id="detail-content" class="text-slate-700">
                        <!-- JS Injected Body -->
                    </div>

                    <!-- Author Footer -->
                    <div class="mt-20 pt-10 border-t flex items-center gap-6" id="detail-footer">
                        <!-- JS Injected Author Info -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer (injected by assets/js/main.js) -->
    <div id="footer-placeholder"></div>

    <!-- Scripts: classic + defer, so the shared header/footer work on file:// too -->
    <script src="assets/js/main.js" defer></script>

    <script src="assets/js/pages/blog.js" defer></script>
</body>
</html>
